name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL download ZIP project"
        required: true
        type: string
      tag:
        description: "Build tag"
        required: true
        type: string
      build_type:
        description: "release atau debug"
        required: true
        default: "release"
        type: choice
        options:
          - release
          - debug

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DEBIAN_FRONTEND: noninteractive
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2 -Dorg.gradle.jvmargs=-Xmx4g"

    steps:
      - name: Checkout helper
        uses: actions/checkout@v4

      - name: Download project
        shell: bash
        run: |
          set -e
          rm -rf project_raw project.zip
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 15 --max-time 900             -H "Authorization: Bearer ${{ secrets.GH_TOKEN }}"             -H "Accept: application/octet-stream"             "${{ inputs.zip_url }}" -o project.zip
          unzip -t project.zip >/dev/null
          mkdir project_raw
          unzip -q project.zip -d project_raw

      - name: Detect project root
        shell: bash
        run: |
          set -e
          ROOT=""
          if [ -f project_raw/pubspec.yaml ] || [ -f project_raw/android/gradlew ]; then
            ROOT="project_raw"
          else
            CANDIDATE=$(find project_raw -maxdepth 3 -type f ( -name pubspec.yaml -o -name gradlew ) -print -quit)
            if [ -n "$CANDIDATE" ]; then
              ROOT=$(dirname "$CANDIDATE")
              [ "$(basename "$CANDIDATE")" = "gradlew" ] || ROOT=$(dirname "$CANDIDATE")
            fi
          fi
          if [ -z "$ROOT" ]; then
            echo "PROJECT_ROOT=" >> "$GITHUB_ENV"
          else
            echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"
          fi
          echo "Detected: $ROOT"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter stable
        if: env.PROJECT_ROOT != ''
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Repair Flutter project metadata
        if: env.PROJECT_ROOT != ''
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set +e
          if [ -f pubspec.yaml ]; then
            flutter clean
            flutter pub get
            if [ $? -ne 0 ]; then
              flutter pub get --offline
            fi
          fi
          exit 0

      - name: Build Flutter APK
        if: env.PROJECT_ROOT != ''
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -o pipefail
          if [ -f pubspec.yaml ]; then
            flutter clean || true
            flutter pub get
            if [ "${{ inputs.build_type }}" = "debug" ]; then
              flutter build apk --debug
            else
              flutter build apk --release
            fi
          elif [ -f android/gradlew ]; then
            cd android
            chmod +x gradlew
            if [ "${{ inputs.build_type }}" = "debug" ]; then
              ./gradlew assembleDebug --no-daemon --stacktrace
            else
              ./gradlew assembleRelease --no-daemon --stacktrace
            fi
          else
            echo "No supported Android/Flutter project found."
            exit 2
          fi

      - name: Recovery build
        if: failure() && env.PROJECT_ROOT != ''
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set +e
          if [ -f pubspec.yaml ]; then
            flutter clean
            rm -rf .dart_tool build
            flutter pub get
            flutter build apk --debug
          elif [ -f android/gradlew ]; then
            cd android
            chmod +x gradlew
            ./gradlew clean --no-daemon || true
            ./gradlew assembleDebug --no-daemon --stacktrace
          fi
          exit $?

      - name: Locate APK
        shell: bash
        run: |
          set -e
          APK=$(find "$GITHUB_WORKSPACE" -type f -name "*.apk"             ! -path "*/.gradle/*" | head -n 1)
          if [ -z "$APK" ]; then
            echo "APK belum ditemukan."
            exit 3
          fi
          mkdir -p output
          cp "$APK" output/app.apk
          ls -lh output/app.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: flutter-${{ inputs.build_type }}-${{ inputs.tag }}
          path: output/app.apk
          retention-days: 3
          if-no-files-found: error
